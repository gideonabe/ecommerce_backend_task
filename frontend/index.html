<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Shelf</title>
    <style>
      :root {
        --ink: #202a2e;
        --muted: #687579;
        --paper: #f5f1e8;
        --panel: #fffdf8;
        --accent: #d85c3d;
        --accent-dark: #a9402b;
        --line: #ded8ca;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        color: var(--ink);
        background: radial-gradient(circle at top right, #f4d6b9 0, transparent 30rem), var(--paper);
        font-family: Georgia, "Times New Roman", serif;
      }

      main { width: min(1120px, calc(100% - 2rem)); margin: 0 auto; padding: 3rem 0 4rem; }

      header { display: flex; align-items: end; justify-content: space-between; gap: 1rem; margin-bottom: 2rem; }
      .eyebrow { margin: 0 0 .5rem; color: var(--accent-dark); font: 700 .75rem/1.2 system-ui, sans-serif; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(2.5rem, 7vw, 5.5rem); line-height: .9; font-weight: 500; }
      .intro { max-width: 34rem; margin: 1rem 0 0; color: var(--muted); font: 1rem/1.5 system-ui, sans-serif; }

      button { border: 0; border-radius: 999px; padding: .7rem 1rem; color: white; background: var(--ink); cursor: pointer; font: 700 .85rem system-ui, sans-serif; }
      button:hover { background: var(--accent-dark); }
      button:disabled { opacity: .6; cursor: wait; }

      #status { min-height: 1.5rem; margin: 1rem 0; color: var(--muted); font: .9rem system-ui, sans-serif; }
      #status.error { color: var(--accent-dark); }
      .products { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 1rem; }

      .product { 
        display: flex;
        overflow: hidden; 
        border: 1px solid var(--line); 
        background: var(--panel); 
        box-shadow: 0 12px 30px rgb(65 48 29 / 7%); 
      }

      .product-image { 
        display: grid; 
        place-items: center; 
        width: 120px;
        min-width: 120px;
        aspect-ratio: 1 / 1;
        background: #e8dfcf; 
        color: #9b907c; 
        font: 700 .75rem system-ui, sans-serif; 
        letter-spacing: .1em; 
        text-transform: uppercase; 
      }
      .product-image img { width: 100%; height: 100%; object-fit: cover; }
      .product-body { padding: 1.1rem; }
      .category { margin: 0 0 .5rem; color: var(--accent-dark); font: 700 .7rem system-ui, sans-serif; letter-spacing: .1em; text-transform: uppercase; }
      h2 { margin: 0; font-size: 1.45rem; font-weight: 500; }
      .description { min-height: 3rem; margin: .7rem 0 1.1rem; color: var(--muted); font: .9rem/1.45 system-ui, sans-serif; }
      .meta { display: flex; align-items: center; justify-content: space-between; gap: .5rem; border-top: 1px solid var(--line); padding-top: .8rem; font: 700 .9rem system-ui, sans-serif; }
      .price { color: var(--accent-dark); font-size: 1.1rem; }
      .empty { grid-column: 1 / -1; padding: 3rem; border: 1px dashed var(--line); text-align: center; color: var(--muted); font: 1rem system-ui, sans-serif; }

      @media (max-width: 600px) {
        main { padding-top: 2rem; }
        header { align-items: start; flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">Local catalogue</p>
          <h1>Product shelf</h1>
          <p class="intro">A small browser window into the products served by your e-commerce API.</p>
        </div>
        <button id="refresh" type="button">Refresh products</button>
      </header>

      <p id="status" role="status">Loading products...</p>
      <section id="products" class="products" aria-live="polite"></section>
    </main>

    <script>
      const apiUrl = "http://localhost:5000/api/v1/products";
      const productsElement = document.querySelector("#products");
      const statusElement = document.querySelector("#status");
      const refreshButton = document.querySelector("#refresh");

      const escapeHtml = (value) => String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

      const formatPrice = (price) => `$${Number(price).toFixed(2)}`;

      const renderProducts = (products) => {
        if (products.length === 0) {
          productsElement.innerHTML = '<p class="empty">No products found. Add one through Postman, then refresh.</p>';
          return;
        }

        productsElement.innerHTML = products.map((product) => {
          const image = product.imageUrl
            ? `<img src="${escapeHtml(product.imageUrl)}" alt="${escapeHtml(product.name)}"/>`
            : "No image";

          return `
            <article class="product">
              <div class="product-image">${image}</div>
              <div class="product-body">
                <p class="category">${escapeHtml(product.category || "Uncategorized")}</p>
                <h2>${escapeHtml(product.name)}</h2>
                <p class="description">${escapeHtml(product.description)}</p>
                <div class="meta">
                  <span class="price">${formatPrice(product.price)}</span>
                  <span>${escapeHtml(product.stock)} in stock</span>
                </div>
              </div>
            </article>`;
        }).join("");
      };

      const loadProducts = async () => {
        refreshButton.disabled = true;
        statusElement.className = "";
        statusElement.textContent = "Loading products...";

        try {
          const response = await fetch(apiUrl);
          if (!response.ok) throw new Error(`API returned ${response.status}`);
          const result = await response.json();
          renderProducts(result.data.products);
          statusElement.textContent = `${result.data.pagination.total} product${result.data.pagination.total === 1 ? "" : "s"}`;
        } catch (error) {
          productsElement.innerHTML = "";
          statusElement.className = "error";
          statusElement.textContent = `Could not load products: ${error.message}. Is the API running?`;
        } finally {
          refreshButton.disabled = false;
        }
      };

      refreshButton.addEventListener("click", loadProducts);
      loadProducts();
    </script>
  </body>
</html>
